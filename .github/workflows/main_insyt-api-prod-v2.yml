name: Build and deploy Python app to Azure Web App - insyt-api-prod-v2
'on':
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful immutable package preparation run ID
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
    - name: Checkout exact release verification source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Set up release-verification Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install release-verification dependency
      run: python -m pip install cryptography==46.0.3
    - name: Validate package preparation run
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INSYT_PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      run: python tools/insyt_deployment_gate.py --component api --sha "$GITHUB_SHA" --package-run-id "$INSYT_PACKAGE_RUN_ID"
        --verify-package-run-only
    - name: Download exact retained artifact
      uses: actions/download-artifact@v4
      with:
        name: insyt-api-${{ github.sha }}
        path: retained_artifact
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.package_run_id }}
    - name: Verify signed archive and extract authorized package
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INSYT_PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      run: python tools/insyt_deployment_gate.py --component api --sha "$GITHUB_SHA" --package-run-id "$INSYT_PACKAGE_RUN_ID"
        --artifact-directory retained_artifact --extract-to insyt_api_package
    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_89A3170DEABA4C018B31842BAE0D2ECF }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_33625B8B6B6E4A47B3348C566FDF023E }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6AA7045D267940D788FE5726B33A9F05 }}
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      id: deploy-to-webapp
      with:
        app-name: insyt-api-prod-v2
        slot-name: Production
        package: ./insyt_api_package
