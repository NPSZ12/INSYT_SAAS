name: INSYT Release Package Preparation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prepare-api:
    name: Prepare immutable API artifact
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: 'false'
    - name: Verify exact source revision
      run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Set up Python version
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Create and Start virtual environment and Install dependencies
      run: "python -m venv antenv\nsource antenv/bin/activate\npip install -r backend/requirements.txt\n      \n"
    - name: Prepare immutable api archive
      run: 'set -euo pipefail

        test -d "backend"

        mkdir -p retained_artifact

        tar -C "backend" -cf retained_artifact/api.tar .

        test -s retained_artifact/api.tar

        sha256sum retained_artifact/api.tar'
    - name: Fingerprint retained api artifact
      run: python3 tools/insyt_artifact_integrity.py digest --path retained_artifact
    - name: Validate retained api package compatibility
      run: 'set -euo pipefail

        digest="$(sha256sum retained_artifact/api.tar | cut -d " " -f 1)"

        python3 tools/insyt_retained_artifact.py --archive retained_artifact/api.tar --destination package_compatibility_check
        --expected-sha256 "$digest"

        test -f package_compatibility_check/requirements.txt

        test -f package_compatibility_check/app/main.py

        rm -rf package_compatibility_check'
    - name: Retain exact api artifact
      uses: actions/upload-artifact@v4
      with:
        name: insyt-api-${{ github.sha }}
        path: retained_artifact/api.tar
        if-no-files-found: error
        retention-days: '30'
        compression-level: '0'
        overwrite: 'false'
  prepare-frontend:
    name: Prepare immutable frontend artifact
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: 'false'
    - name: Verify exact source revision
      run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      working-directory: frontend
      run: npm install
    - name: Build Next.js app
      working-directory: frontend
      env:
        NEXT_PUBLIC_API_BASE_URL: https://api.insyt360.com
      run: npm run build
    - name: Package the existing Next.js standalone frontend
      run: 'set -euo pipefail

        test -f frontend/.next/standalone/server.js

        test -f frontend/.next/BUILD_ID

        test -f frontend/.next/standalone/.next/BUILD_ID

        test -d frontend/.next/static


        test "$(cat frontend/.next/BUILD_ID)" = "$(cat frontend/.next/standalone/.next/BUILD_ID)"

        mkdir -p frontend_release_package/.next

        cp -a frontend/.next/standalone/. frontend_release_package/

        cp -a frontend/.next/static frontend_release_package/.next/static

        cp -a frontend/public frontend_release_package/public


        test -f frontend_release_package/server.js

        test -f frontend_release_package/.next/BUILD_ID

        test -d frontend_release_package/.next/static

        test "$(cat frontend/.next/BUILD_ID)" = "$(cat frontend_release_package/.next/BUILD_ID)"


        # Do not ship generated runtime cache or duplicate standalone trees.

        rm -rf frontend_release_package/.next/server/route-cache

        test ! -e frontend_release_package/.next/standalone

        echo "Verified one consistent Next.js standalone deployment package"

        '
    - name: Prepare immutable frontend archive
      run: 'set -euo pipefail

        test -d "frontend_release_package"

        mkdir -p retained_artifact

        tar -C "frontend_release_package" -cf retained_artifact/frontend.tar .

        test -s retained_artifact/frontend.tar

        sha256sum retained_artifact/frontend.tar'
    - name: Fingerprint retained frontend artifact
      run: python3 tools/insyt_artifact_integrity.py digest --path retained_artifact
    - name: Validate retained frontend package compatibility
      run: 'set -euo pipefail

        digest="$(sha256sum retained_artifact/frontend.tar | cut -d " " -f 1)"

        python3 tools/insyt_retained_artifact.py --archive retained_artifact/frontend.tar --destination package_compatibility_check
        --expected-sha256 "$digest"

        test -f package_compatibility_check/server.js

        test -f package_compatibility_check/.next/BUILD_ID

        test -d package_compatibility_check/.next/static

        test -f package_compatibility_check/.next/server/app/cyber-utility/intake.html

        rm -rf package_compatibility_check'
    - name: Retain exact frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: insyt-frontend-${{ github.sha }}
        path: retained_artifact/frontend.tar
        if-no-files-found: error
        retention-days: '30'
        compression-level: '0'
        overwrite: 'false'
