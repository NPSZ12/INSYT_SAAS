name: Build and deploy APC worker to Azure Function App - insyt-apc-worker-prod-v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: insyt-apc-worker-prod-v2
  AZURE_FUNCTIONAPP_PACKAGE_PATH: workers/insyt_processing_worker
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Debian 11 readpst runtime
        run: |
          cd "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"

          rm -rf native/readpst
          mkdir -p native/readpst/bin
          mkdir -p native/readpst/lib

          docker run --rm \
            -v "$PWD/native/readpst:/out" \
            debian:11-slim \
            bash -lc '
              set -euo pipefail

              apt-get update

              apt-get install -y \
                --no-install-recommends \
                pst-utils

              cp /usr/bin/readpst \
                /out/bin/readpst

              chmod 0755 \
                /out/bin/readpst

              ldd /usr/bin/readpst \
                > /out/ldd.txt

              dpkg-query -W \
                -f="\${Package}=\${Version}\n" \
                pst-utils \
                libpst4 \
                > /out/packages.txt

              ldd /usr/bin/readpst |
              awk '"'"'
                $2 == "=>" && $3 ~ /^\// {
                  print $3
                }
                $1 ~ /^\// {
                  print $1
                }
              '"'"' |
              sort -u |
              while read -r library
              do
                name="$(basename "$library")"

                case "$name" in
                  libc.so.6|\
                  libm.so.6|\
                  libpthread.so.0|\
                  libdl.so.2|\
                  librt.so.1|\
                  libresolv.so.2|\
                  ld-linux-x86-64.so.2)
                    continue
                    ;;
                esac

                cp -L "$library" \
                  "/out/lib/$name"
              done

              chmod -R a+rX /out

              /usr/bin/readpst -V \
                > /out/version.txt \
                2>&1 || true
            '

          echo "=== Bundled readpst ==="
          cat native/readpst/version.txt || true

          echo "=== Debian packages ==="
          cat native/readpst/packages.txt

          echo "=== Native libraries ==="
          ls -lah native/readpst/lib

      - name: Install worker dependencies
        run: |
          cd "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          rm -rf .python_packages
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --target=".python_packages/lib/site-packages"
          python -c "from pathlib import Path; p=Path('.python_packages/lib/site-packages'); print('site-packages exists:', p.exists()); print('top-level entries:', len(list(p.iterdir())) if p.exists() else 0)"

      - name: Deploy APC Worker Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_INSYT_APC_WORKER_PROD_V2 }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false
