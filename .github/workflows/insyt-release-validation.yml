name: INSYT Release Validation

on:
  pull_request:
  push:
    branches:
      - release/json-promotion-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-source:
    name: Protected Source Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release-validation dependencies
        run: python -m pip install cryptography==46.0.3 PyYAML==6.0.2

      - name: Validate deployment gate preservation
        run: python -m unittest discover -s tools -p 'test_insyt_deployment_gate.py' -v

      - name: Validate JSON feature isolation
        run: |
          python -m unittest discover -s tools -p 'test_insyt_feature_scope.py' -v

      - name: Validate authoritative scope verification
        run: python -m unittest discover -s tools -p 'test_insyt_authoritative_scope.py' -v

      - name: Validate cumulative hardened history
        run: python -m unittest discover -s tools -p 'test_insyt_hardened_transition.py' -v

      - name: Validate trusted policy retrieval
        run: python -m unittest discover -s tools -p 'test_insyt_trusted_policy_loader.py' -v

      - name: Validate signed release approvals
        run: |
          python -m pip install cryptography==46.0.3
          python -m unittest discover -s tools -p 'test_insyt_signed_release_approval.py' -v

      - name: Validate deployment artifact integrity
        run: python -m unittest discover -s tools -p 'test_insyt_artifact_integrity.py' -v

      - name: Validate integrated release evidence
        run: python -m unittest discover -s tools -p 'test_insyt_release_evidence.py' -v

      - name: Validate retained artifact extraction
        run: python -m unittest discover -s tools -p 'test_insyt_retained_artifact.py' -v

      - name: Validate reusable release security regressions
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_insyt_complete_deployment_scope.py' -v
          python -m unittest discover -s tools -p 'test_insyt_dynamic_deployment_scope.py' -v
          python -m unittest discover -s tools -p 'test_insyt_release_evidence.py' -v
          python -m unittest discover -s tools -p 'test_insyt_signed_new_scope.py' -v
          python -m unittest discover -s tools -p 'test_insyt_release_candidate.py' -v
          python -m unittest discover -s tools -p 'test_insyt_trusted_policy_execution.py' -v
          python -m unittest discover -s tools -p 'test_insyt_policy_renewal.py' -v
          python -m unittest discover -s tools -p 'test_insyt_release_transition.py' -v
          python -m unittest discover -s tools -p 'test_insyt_protected_source.py' -v
          python -m unittest discover -s tools -p 'test_insyt_new_scope_validation.py' -v

      - name: Validate Hardened Workflow Registry
        run: python tools/insyt_hardened_registry_check.py --validate-candidate

      - name: Enforce existing production guard
        run: python tools/insyt_release_guard.py --validate-reusable-candidate

  api-validation:
    name: API Startup and JSON Regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install production backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Start disposable TLS PostgreSQL
        run: bash tools/insyt_ci_postgres_tls.sh

      - name: Validate complete API and database startup
        run: python tools/insyt_api_startup_check.py

      - name: Validate functional login MFA and Entra contracts
        run: |
          python -m pip install httpx==0.28.1
          python tools/insyt_auth_runtime_check.py

      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm -f insyt-ci-postgres-tls || true

      - name: Validate native JSON and Cyber2 regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/backend/app/api/cyber2
        run: |
          set -euo pipefail
          python -m pytest -q --import-mode=importlib \
            backend/app/api/cyber2/test_json*.py \
            backend/app/services/cyber2/test_json*.py


  frontend-validation:
    name: Frontend Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
